# One fixed light theme (readable on projectors). Deep blue is the only accent colour.
[theme]
base = "light"
primaryColor = "#1f4e9a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1a1a1a"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
